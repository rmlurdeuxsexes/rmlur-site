<!-- ================= PRODUCT DETAIL OVERLAY (Yeezy-style) ================= -->
<div id="pdp-overlay" class="pdp-overlay" hidden>
  <div class="pdp-topbar">
    <button id="pdp-back" class="pdp-back" aria-label="Close">‹</button>
    <div class="pdp-cart"><span id="pdp-cart-count">0</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
    </div>
  </div>

  <div class="pdp-body">
    <div class="pdp-image">
      <img id="pdp-cover" src="" alt="">
      <button class="pdp-play" id="pdp-play" aria-label="Preview">►</button>
    </div>

    <div id="pdp-panel" class="pdp-panel">
      <!-- collapsed state -->
      <div id="pdp-collapsed" class="pdp-collapsed">
        <div id="pdp-title-c" class="pdp-title"></div>
        <div id="pdp-price-c" class="pdp-price"></div>
        <button id="pdp-expand" class="pdp-plus" aria-label="Select format">+</button>
      </div>

      <!-- expanded state -->
      <div id="pdp-expanded" class="pdp-expanded" hidden>
        <div class="pdp-row">
          <button id="pdp-info-q" class="pdp-q" aria-label="Track info">?</button>
          <div id="pdp-status" class="pdp-status">SELECT FORMAT</div>
          <button id="pdp-close-x" class="pdp-x" aria-label="Close">×</button>
        </div>
        <div id="pdp-price" class="pdp-price"></div>
        <div id="pdp-tiers" class="pdp-tiers"></div>
        <button id="pdp-exclusive" class="pdp-exclusive-btn" hidden></button>
        <button id="pdp-info-toggle" class="pdp-info-toggle">INFORMATION</button>
        <div id="pdp-info-panel" class="pdp-info-panel" hidden></div>
      </div>
    </div>
  </div>
</div>

<!-- ================= SHOP — full catalog, tape-label styled ================= -->
<main id="shop">
  <a class="back-link" href="index.html">← Back</a>
  <div class="shop-head">
    <h1>Shop</h1>
    <nav class="tabs" aria-label="Filter products">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="beat">Beats</button>
      <button class="tab" data-filter="kit">Kits</button>
      <a class="tab tab-link" href="mailto:jayrewindbeatz@gmail.com?subject=Custom%20work">Custom</a>
    </nav>
  </div>

  <div class="fb-stage-wrap" id="fb-stageWrap">
    <canvas id="fb-stage"></canvas>
    <div class="fb-tag fb-tag-active" id="fb-activeTag" hidden><div class="fb-tag-inner">
      <div class="fb-title" id="fb-activeTitle"></div>
      <div class="fb-meta" id="fb-activeMeta"></div>
      <div class="fb-row"><span class="fb-price" id="fb-activePrice"></span><button class="fb-load-btn" id="fb-loadBtn">View &amp; Buy →</button></div>
    </div></div>
    <div class="fb-tag fb-tag-hover" id="fb-hoverTag" hidden><div class="fb-tag-inner">
      <div class="fb-title" id="fb-hoverTitle"></div>
      <div class="fb-price" id="fb-hoverPrice"></div>
    </div></div>
  </div>
  <div class="fb-nav">
    <button id="fb-prev" aria-label="Prev">‹</button>
    <div class="fb-dots" id="fb-dots"></div>
    <button id="fb-next" aria-label="Next">›</button>
  </div>
  <p id="empty-state" class="empty-state" hidden>nothing here yet.</p>
</main>

  </div>
  <a id="pb-buy" class="buy-btn buy-btn-sm" href="#" target="_blank" rel="noopener">BUY</a>
</div>
