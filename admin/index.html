<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>RMLUR — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="login-form">
  <h1>Admin Login</h1>
  <label for="password">Password</label>
  <input type="password" id="password" autocomplete="current-password">
  <button id="login-btn">Log In</button>
  <div class="status" id="login-status"></div>
</div>

<form id="upload-form">
  <h1>Add Product</h1>

  <label for="id">ID (slug, e.g. midnight-pager-2)</label>
  <input type="text" id="id" required>

  <label for="type">Type</label>
  <select id="type">
    <option value="beat">Beat</option>
    <option value="kit">Kit</option>
    <option value="loopkit">Loop Kit</option>
    <option value="sample">Sample Pack</option>
    <option value="project">Project File</option>
  </select>

  <label for="title">Title (shown exactly as typed)</label>
  <input type="text" id="title" required>

  <label for="genre">Genre</label>
  <input type="text" id="genre" required>

  <label for="bpm">BPM</label>
  <input type="number" id="bpm" min="1" max="400">

  <label for="key">Key (optional)</label>
  <input type="text" id="key">

  <label for="info">Description</label>
  <textarea id="info" rows="4"></textarea>

  <label for="price-wav">WAV price (USD) — the default license</label>
  <input type="number" id="price-wav" step="0.01" min="0" value="34.99">

  <label for="price-mp3">MP3 price (USD) — cheaper, lower quality</label>
  <input type="number" id="price-mp3" step="0.01" min="0" value="24.99">

  <label for="price-stems">Stems price (USD)</label>
  <input type="number" id="price-stems" step="0.01" min="0" value="59.99">

  <label for="price-exclusive">Exclusive price (USD) — blank for none</label>
  <input type="number" id="price-exclusive" step="0.01" min="0" value="249.99">

  <label for="wav">WAV master (paid download, stored privately)</label>
  <input type="file" id="wav" accept=".wav,.aif,.aiff,.flac,audio/*">

  <label for="mp3">MP3 download (optional — adds the MP3 license)</label>
  <input type="file" id="mp3" accept=".mp3,audio/mpeg">

  <label for="stems">Stems zip (optional — adds the STEMS license)</label>
  <input type="file" id="stems" accept=".zip,application/zip">

  <label for="cover">Cover Art (optional)</label>
  <input type="file" id="cover" accept="image/png,image/jpeg,image/webp">

  <label for="preview">Audio Preview — the free-to-play clip (optional)</label>
  <input type="file" id="preview" accept="audio/mpeg,audio/wav">

  <button type="submit">Publish</button>
  <div class="status" id="upload-status"></div>
</form>

<script type="module" src="admin.js"></script>
</body>
</html>
