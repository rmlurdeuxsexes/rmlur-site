<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks — RMLUR :: deux SEXES</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="store.css">
<style>.tok{display:block;margin-top:22px;padding:14px 18px;border:1px solid #1b1b1b;border-radius:12px;text-decoration:none;color:inherit;font-size:12px;letter-spacing:.06em;background:repeating-linear-gradient(135deg,#f6f3ea 0 10px,#f1ede2 10px 20px)}.tok b{font-size:22px}.tok span{color:#6b675e;font-size:11px}</style>
</head>
<body>
<a class="back-link" href="store.html">← Back to beats</a>
<main style="max-width:560px;text-align:center">
  <h1 style="font-weight:500;font-size:18px">Thank you.</h1>
  <p id="msg" class="empty">Confirming your payment…</p>
  <div id="files" style="display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:18px"></div>
</main>
<script src="/rmlur-tokens.js"></script>
<script>
(function () {
  var id = new URLSearchParams(location.search).get('session_id');
  var msg = document.getElementById('msg'), box = document.getElementById('files');
  function link(href, text) { var a = document.createElement('a'); a.className = 'btn buy'; a.href = href; a.textContent = text; box.appendChild(a); }
  function tryOnce(n) {
    fetch('/api/order?session_id=' + encodeURIComponent(id)).then(function (r) { return r.json().then(function (j) { return [r.ok, j]; }); })
    .then(function (res) {
      if (!res[0]) { if (n < 5) return setTimeout(function () { tryOnce(n + 1); }, 2000); msg.textContent = 'We could not confirm this order yet. If you were charged, email rmlurdeuxsexes@gmail.com with your receipt.'; return; }
      var o = res[1];
      msg.textContent = o.title + ' — ' + o.license + ' license' + (o.email ? ' (receipt sent to ' + o.email + ')' : '');
      o.files.forEach(function (f) { link(f.url, 'Download ' + f.label); });
      link(o.licenseUrl, 'License PDF');
      if (o.tokens) {                                             // RMLUR Tokens card
        RmlurTokens.save(o.tokens.card);
        var t = o.tokens, c = document.createElement('a'); c.href = '/tokens.html#' + t.card; c.className = 'tok';
        var need = t.costs.mp3 - t.balance;
        c.innerHTML = '<b>' + t.balance + '</b> RMLUR TOKENS<br><span>' + (o.paidWithTokens ? 'Paid with tokens — enjoy the beat.' : need > 0 ? need + ' more for a free MP3 lease' : 'Enough for a free lease — use them in the store') + ' · open your token card →</span>';
        box.appendChild(c);
      }
      if (o.fulfilment === 'manual') { var p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Your files are being prepared and will be emailed to you shortly.'; box.appendChild(p); }
    }).catch(function () { msg.textContent = 'Something went wrong loading your order. Email rmlurdeuxsexes@gmail.com.'; });
  }
  if (!id) msg.textContent = 'No order found.'; else tryOnce(0);
})();
</script>
<script src="/spin-badge.js" defer></script>
</body>
</html>
